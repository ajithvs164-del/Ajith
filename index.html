<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Paaru</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            font-family: 'Dancing Script', cursive;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            position: relative;
            min-width: 350px;
        }

        h1 { color: #d00000; font-size: 2.5em; margin-bottom: 20px; }
        .btn-container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 20px; align-items: center; }

        button {
            padding: 12px 25px;
            font-size: 1.2em;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-family: 'Dancing Script', cursive;
        }

        .btn-yes { background-color: #ff4d6d; color: white; }
        .btn-no { background-color: #590d22; color: white; }

        #floating-yes { position: fixed; z-index: 100; pointer-events: auto; }

        .hidden { display: none; }

        /* Heart Animation */
        .heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 2em;
            animation: floatUp 2s linear forwards;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-500px) scale(1.5); opacity: 0; }
        }

        .exit-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #800f2f;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            z-index: 1000;
        }

        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border: 2px solid #ff4d6d;
            z-index: 2000;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        .gift-container { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        .gift-box { font-size: 4em; cursor: pointer; transition: transform 0.2s; }
        .gift-box:hover { transform: scale(1.2); }
    </style>
</head>
<body>

    <!-- Screen 1 -->
    <div id="screen1" class="container">
        <h1>Hi Paaru, Would you like to proceed?</h1>
        <div class="btn-container">
            <button id="main-yes" class="btn-yes" onclick="goToScreen2()">Yes</button>
            <button id="main-no" class="btn-no" onclick="handleNo()">No</button>
        </div>
        <div id="secondary-options" class="hidden" style="margin-top: 20px;">
            <p style="font-size: 1.5em; color: #590d22;">Are you sure?</p>
            <button id="floating-yes" class="btn-yes" onclick="goToScreen2()">Yes</button>
        </div>
    </div>

    <!-- Screen 2 -->
    <div id="screen2" class="container hidden">
        <h1>I Love YOU tons, and do you love me?</h1>
        <div class="btn-container">
            <button class="btn-yes" onclick="showBunnies('yes')">Yes</button>
            <button class="btn-no" onclick="showBunnies('no')">No</button>
        </div>
        <div id="bunny-effect" class="hidden" style="font-size: 5em; margin-top: 20px;">
            🐰💋🐰
        </div>
        <div id="no-message" class="hidden" style="font-size: 1.5em; color: #d00000; margin-top: 10px;">
            In this Universe, No is considered Yes, Love you Tooooo
        </div>
    </div>

    <!-- Screen 3 (Final Gifts) -->
    <div id="screen3" class="container hidden">
        <h1 style="font-size: 3em;">Love you Shungammeee</h1>
        <div style="font-size: 5em;">🐼💋🐼</div>
        <div class="gift-container">
            <div class="gift-box" onclick="alert('UMMAAA')">🎁</div>
            <div class="gift-box" onclick="alert('Chakkara ummaaaa')">🎁</div>
            <div class="gift-box" onclick="alert('Shungumaaaaaaa')">🎁</div>
        </div>
    </div>

    <!-- Screen 4 (Final Message) -->
    <div id="screen4" class="container hidden">
        <h1 style="font-size: 3.5em;">Love You in Every universe</h1>
    </div>

    <!-- Exit and Password UI -->
    <button id="exit-btn" class="exit-btn hidden" onclick="showPasswordPrompt()">Exit</button>
    
    <div id="passwordModal" class="modal">
        <h3>Enter Secret Code</h3>
        <input type="password" id="pwInput" style="padding: 10px; margin-bottom: 10px;"><br>
        <button class="btn-yes" onclick="checkPassword()">Enter</button>
    </div>

    <script>
        function handleNo() {
            document.getElementById('main-no').innerText = "are you sure";
            const yesBtn = document.getElementById('main-yes');
            
            // Animation for Yes button
            yesBtn.style.transform = "scale(1.8)";
            yesBtn.style.transition = "transform 0.5s ease-in-out";
            
            document.getElementById('secondary-options').classList.remove('hidden');
            const floatYes = document.getElementById('floating-yes');
            
            // Initialize floating position
            floatYes.style.left = '45%';
            floatYes.style.top = '60%';

            document.addEventListener('mousemove', (e) => {
                const rect = floatYes.getBoundingClientRect();
                const mouseX = e.clientX;
                const mouseY = e.clientY;
                
                // Calculate distance from cursor to floating button center
                const distance = Math.sqrt(Math.pow(mouseX - (rect.left + rect.width/2), 2) + Math.pow(mouseY - (rect.top + rect.height/2), 2));
                
                // If cursor gets close, move the button
                if (distance < 80) {
                    floatYes.style.left = Math.random() * (window.innerWidth - 100) + 'px';
                    floatYes.style.top = Math.random() * (window.innerHeight - 50) + 'px';
                }
            });
        }

        function goToScreen2() {
            hideAll();
            document.getElementById('screen2').classList.remove('hidden');
            document.getElementById('exit-btn').classList.remove('hidden');
        }

        function showBunnies(choice) {
            document.getElementById('bunny-effect').classList.remove('hidden');
            createHearts();
            if(choice === 'no') {
                document.getElementById('no-message').classList.remove('hidden');
            }
        }

        function createHearts() {
            for(let i=0; i<30; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.innerHTML = '❤️';
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.top = '100vh';
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 2000);
                }, i * 100);
            }
        }

        function showPasswordPrompt() {
            document.getElementById('passwordModal').style.display = 'block';
        }

        function checkPassword() {
            const pw = document.getElementById('pwInput').value;
            if(pw === "Nandumon@Parumol") {
                hideAll();
                document.getElementById('passwordModal').style.display = 'none';
                document.getElementById('screen3').classList.remove('hidden');
                document.getElementById('exit-btn').onclick = goToFinal;
                createHearts();
            } else {
                alert("ERROR! No TRUU LUB");
            }
        }

        function goToFinal() {
            hideAll();
            document.getElementById('screen4').classList.remove('hidden');
            document.getElementById('exit-btn').classList.add('hidden');
        }

        function hideAll() {
            document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
        }
    </script>
</body>
</html>
